<VirtualHost $DTCDN_HOSTNAME:443>

    ServerName $DTCDN_HOSTNAME
    Protocols h2 http/1.1

    DocumentRoot "/home/dtcdn/www"
    CustomLog ${APACHE_LOG_DIR}/dtcdn.access.log combined
    
    <Directory "/home/dtcdn/www">
        allow from all
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Files .user.ini>
        Order allow,deny
        Deny from all
    </Files>

    # php-fpm status page, this box only (pm.status_path in the pool file). `Require local` also
    # accepts a connection from the host's own address, which is what a curl to the hostname from
    # the box is; `Require ip 127.0.0.1` wouldn't, and 127.0.0.1 never reaches this address-bound vhost.
    <LocationMatch "^/fpm-status$">
        Require local
        SetHandler "proxy:unix:/run/php/php7.4-fpm.sock|fcgi://localhost"
    </LocationMatch>

    # og-image screenshot service (running on Node)
    ProxyPreserveHost On
    ProxyPass        /og-image http://127.0.0.1:4101/screenshot
    ProxyPassReverse /og-image http://127.0.0.1:4101/screenshot
    
	#Alias /awstatsclasses "/usr/share/awstats/lib/"
	#Alias /awstats-icon "/usr/share/awstats/icon/"
	#Alias /awstatscss "/usr/share/doc/awstats/examples/css"
	#ScriptAlias /awstats/ /usr/lib/cgi-bin/

    # Note: letsencrypt should add its config below this line

</VirtualHost>